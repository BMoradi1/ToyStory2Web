<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ToyStory2Web</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="drop">
      <h1>ToyStory2Web</h1>
      <p class="sub">An open reimplementation of the 1999 engine.</p>
      <button id="pick">Choose your game folder</button>
      <p class="hint">
        Or drag your <code>Toy&nbsp;Story&nbsp;2</code> folder here.<br />
        Files are read locally in your browser. Nothing is uploaded.
      </p>
      <p id="status"></p>
    </div>
    <div id="app" hidden>
      <header>
        <select id="level"></select>
        <select id="model"></select>
        <select id="anim"></select>
        <span id="info"></span>
      </header>
      <div id="textures"></div>
      <canvas id="view"></canvas>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
